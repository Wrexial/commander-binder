<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the CSS use env(safe-area-inset-*) so the
         hamburger, sidebar and toast clear notches/home indicators. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Legendex — Legendary Creature Collector</title>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Legendex — browse and track your collection of Magic: The Gathering legendary creatures, ordered by their first appearance in the game."
    />
    <meta
      name="keywords"
      content="Legendex, Magic: The Gathering, MTG, Scryfall, Legendary Creatures, Card Collector, Commander, EDH"
    />
    <meta name="author" content="Dylan Abela" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://commanders-binders.netlify.app/" />
    <meta property="og:title" content="Legendex — Legendary Creature Collector" />
    <meta
      property="og:description"
      content="Legendex — browse and track your MTG legendary creatures by their first appearance."
    />
    <meta property="og:image" content="https://commanders-binders.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Legendex logo above the site title." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://commanders-binders.netlify.app/" />
    <meta property="twitter:title" content="Legendex — Legendary Creature Collector" />
    <meta
      property="twitter:description"
      content="Legendex — browse and track your MTG legendary creatures by their first appearance."
    />
    <meta property="twitter:image" content="https://commanders-binders.netlify.app/og-image.png" />
    <meta property="twitter:image:alt" content="The Legendex logo above the site title." />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0f131c" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles.css" />
    <link rel="stylesheet" href="src/ui/components/sidebar.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Installable-app metadata (Android uses the manifest; iOS uses these). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Legendex" />
  </head>

  <body>
    <div id="sidebar-backdrop"></div>
    <div id="sidebar" class="sidebar"></div>
    <button
      id="openbtn"
      type="button"
      aria-label="Toggle navigation menu"
      aria-controls="sidebar"
      aria-expanded="false"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div id="main">
      <main class="container">
        <header class="main-header">
          <picture>
            <source srcset="logo.webp" type="image/webp" />
            <img src="logo.png" alt="Logo" class="logo" width="84" height="84" />
          </picture>
          <div class="header-text">
            <h1>Legendex</h1>
            <p class="description">
              Browse and track your collection of Magic: The Gathering legendary creatures, ordered
              by their first appearance in the game.
            </p>
          </div>
          <div id="user-actions" class="user-actions"></div>
        </header>
        <!-- Filled in by setupUI for signed-out visitors (GuestWelcome.js). -->
        <div id="guest-welcome"></div>
        <div id="card-settings">
          <div id="search-wrapper">
            <input type="search" id="search-input" placeholder="Search cards..." />
            <button id="clear-search" type="button" aria-label="Clear search" title="Clear search">
              &times;
            </button>
            <button
              id="search-help"
              type="button"
              aria-label="Search syntax help"
              aria-controls="search-tooltip"
              aria-expanded="false"
            >
              ?
            </button>
            <!-- Filled in by renderSearchHelp (src/ui/searchHelp.js). -->
            <div id="search-tooltip" style="display: none"></div>
          </div>
          <div id="owned-counter"></div>
          <button
            id="filter-toggle"
            type="button"
            class="filter-toggle"
            aria-expanded="false"
            aria-controls="filter-panel"
          >
            Filters
            <span id="filter-count" class="filter-count" aria-hidden="true" hidden></span>
          </button>
          <!-- Filled in by initFilterBar (src/ui/filterBar.js). -->
          <div id="filter-panel" class="filter-panel" hidden></div>
        </div>

        <div id="no-results-message" style="display: none">No cards found.</div>
        <div id="results"></div>
      </main>
    </div>

    <!-- Toast / undo area -->
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <div
      id="loading-indicator"
      class="loading-indicator"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div id="set-tooltip" class="set-tooltip"></div>
    <div id="tooltip" class="tooltip" role="tooltip"></div>

    <script type="module" src="src/main.js"></script>
    <footer>
      <p>
        &copy; 2026
        <a href="http://www.dylanabela.com" target="_blank" rel="noopener noreferrer">Dylan Abela</a
        >. All rights reserved.
      </p>
    </footer>
  </body>
</html>
