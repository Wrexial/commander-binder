name: CI debug

# Temporary workflow to work out the cross-platform lockfile fix.
on:
  push:
    branches: [ci-debug]

jobs:
  normalize-then-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Version info
        run: |
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"

      - name: Normalize lockfile on Linux
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Show optional native deps now in lockfile
        run: |
          node -e 'const l=require("./package-lock.json");for(const n of Object.keys(l.packages)){if(/bufferutil|utf-8-validate|node-gyp-build/.test(n))console.log(n,l.packages[n].version)}' || true

      - name: npm ci after normalize
        run: |
          set +e
          npm ci --no-audit --no-fund >/tmp/ci.log 2>&1
          code=$?
          echo "npm ci exit: $code"
          if [ $code -ne 0 ]; then
            node -e 'const fs=require("fs");let s=fs.readFileSync("/tmp/ci.log","utf8");s=s.replace(/%/g,"%25").replace(/\r/g,"").replace(/\n/g,"%0A");console.log("::error::"+s)'
          fi
          exit $code

      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
