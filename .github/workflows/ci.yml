name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep this in sync with .nvmrc (the Node/npm that generated the
      # lockfile). npm drops hoisted optional peer deps from the lockfile when
      # it runs on Windows, so `bufferutil`/`utf-8-validate` are declared as
      # devDependencies in package.json: the explicit entries survive on every
      # platform and keep `npm ci` on Linux happy.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
